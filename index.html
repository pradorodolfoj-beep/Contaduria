<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Financiero Pro</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="header-content">
            <div>
                <h1>Finanzas Pro</h1>
                <p>Gestión inteligente, tasas de cambio y deudas</p>
            </div>
            <!-- Configuración de Hora de Alarma -->
            <div class="alarm-config">
                <label for="hora-aviso">⏰ Hora de Alerta:</label>
                <input type="time" id="hora-aviso" value="09:00">
            </div>
        </div>
    </header>

    <!-- Alertas de Deudas Activas / Vencidas -->
    <div id="alertas-container"></div>

    <!-- Métricas de Resumen (Ahora con Deudas Pendientes) -->
    <section class="metrics-grid">
        <div class="metric-card ingreso">
            <span class="metric-label">Ingresos Totales</span>
            <div id="total-ingresos" class="metric-value">$0.00</div>
        </div>
        <div class="metric-card gasto">
            <span class="metric-label">Gastos Totales</span>
            <div id="total-gastos" class="metric-value">$0.00</div>
        </div>
        <div class="metric-card deuda-card">
            <span class="metric-label">Deudas Pendientes</span>
            <div id="total-deudas" class="metric-value">$0.00</div>
        </div>
        <div class="metric-card balance">
            <span class="metric-label">Balance Neto</span>
            <div id="balance-neto" class="metric-value">$0.00</div>
        </div>
    </section>

    <!-- Gráfica Comparativa -->
    <section class="card chart-section">
        <div class="chart-header">
            <h3>Flujo Financiero</h3>
            <div class="date-filter">
                <input type="date" id="filtro-desde">
                <span>a</span>
                <input type="date" id="filtro-hasta">
                <button id="btn-filtrar" class="btn-secondary">Filtrar</button>
                <button id="btn-reset-filtro" class="btn-ghost" title="Limpiar filtro">↻</button>
            </div>
        </div>
        <div class="chart-wrapper">
            <canvas id="graficaComparativa"></canvas>
        </div>
    </section>

    <!-- Contenido Principal -->
    <main class="main-grid">
        <!-- Formulario -->
        <section class="card form-card">
            <h3 class="card-title">Nuevo Movimiento</h3>
            <form id="finance-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="tipo">Tipo</label>
                        <select id="tipo" required>
                            <option value="ingreso">Ingreso (+)</option>
                            <option value="gasto" selected>Gasto (-)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" required>
                            <option value="Sueldo">Sueldo</option>
                            <option value="Ingreso Extra">Ingreso Extra</option>
                            <option value="Alquiler">Alquiler</option>
                            <option value="Comida">Comida</option>
                            <option value="Salidas">Salidas / Ocio</option>
                            <option value="Deuda">Deuda / Compromiso</option>
                            <option value="Otros">Otros (Personalizado)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group hidden" id="concepto-group">
                    <label for="concepto">Nombre Personalizado</label>
                    <input type="text" id="concepto" placeholder="Ej. Servicios, Inversión...">
                </div>

                <!-- Selector de Tasa de Cambio -->
                <div class="form-group">
                    <label for="tasa-cambio">Tasa de Cambio Aplicada</label>
                    <select id="tasa-cambio">
                        <option value="BCV">Tasa BCV</option>
                        <option value="Euro">Tasa Euro</option>
                        <option value="Binance">Tasa Binance</option>
                        <option value="DolarLibre" selected>Dólar Directo / Divisa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción / Detalle</label>
                    <input type="text" id="descripcion" placeholder="Ej. Pago de tarjeta, Supermercado...">
                </div>

                <div class="form-group hidden" id="vencimiento-group">
                    <label for="fecha-vencimiento" class="text-alert">Fecha de Vencimiento de la Deuda</label>
                    <input type="date" id="fecha-vencimiento">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fecha-registro">Fecha</label>
                        <input type="date" id="fecha-registro" required>
                    </div>

                    <div class="form-group">
                        <label for="monto">Monto ($)</label>
                        <input type="number" id="monto" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Guardar Transacción</button>
            </form>
        </section>

        <!-- Historial -->
        <section class="card history-card">
            <div class="history-header">
                <h3 class="card-title">Historial</h3>
                <button id="btn-limpiar" class="btn-danger">Borrar Todo</button>
            </div>
            <ul id="lista-transacciones"></ul>
        </section>
    </main>
</div>

<script src="./app.js"></script>
</body>
</html>
